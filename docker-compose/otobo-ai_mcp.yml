services:
  mcp:
    image: rotheross/otobo-ai-mcp:${OTOBO_MCP_IMAGE_VERSION:-latest}
    restart: unless-stopped
    networks:
      - otobo_default
    environment:
        - OTOBO_MCP_INTERNAL_URL=${OTOBO_MCP_INTERNAL_URL:-http://web:5000}
        - OTOBO_MCP_PUBLIC_URL=${OTOBO_MCP_PUBLIC_URL:-https://localhost/otobo/index.pl}
        - OTOBO_MCP_WEBSERVICE=${OTOBO_MCP_WEBSERVICE:-OTOBO-AI}
        - OTOBO_MCP_SSL_VERIFY=${OTOBO_MCP_SSL_VERIFY:-false}
        - OTOBO_MCP_TIMEOUT=${OTOBO_MCP_TIMEOUT:-30}
        - OTOBO_MCP_TRANSPORT=${OTOBO_MCP_TRANSPORT:-streamable-http}
        - OTOBO_MCP_BIND=${OTOBO_MCP_BIND:-0.0.0.0}
        - OTOBO_MCP_PORT=${OTOBO_MCP_PORT:-8765}
        - OTOBO_MCP_LOGLEVEL=${OTOBO_MCP_LOGLEVEL:-40}
        # see https://docs.python.org/3/library/logging.html#logging-levels
        # for loglevel description
        - OTOBO_MCP_MAX_TOKENS=${OTOBO_MCP_MAX_TOKENS:-10000}
        - OTOBO_MCP_CHARS_PER_TOKEN=${OTOBO_MCP_CHARS_PER_TOKEN:-3}
        - OTOBO_MCP_IGNORED_LINKED_TICKET_STATES=${OTOBO_MCP_IGNORED_LINKED_TICKET_STATES:-merged,removed}
        - OTOBO_MCP_STATELESS=${OTOBO_MCP_STATELESS:-false}
        - OTOBO_MCP_ELICITATION=${OTOBO_MCP_ELICITATION:-required}
        - OTOBO_MCP_ELICITATION_TIMEOUT=${OTOBO_MCP_ELICITATION_TIMEOUT:-300}
        - OTOBO_MCP_RESOURCE_SERVER_URL=${OTOBO_MCP_RESOURCE_SERVER_URL:-http://mcp:8765/mcp}

networks:
  otobo_default:
    external: true
